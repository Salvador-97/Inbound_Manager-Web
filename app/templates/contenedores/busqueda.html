{%include 'header.html' %}
<title>Búsqueda Contenedores</title>
<h2 class="titulo">Búsqueda Contenedores</h2>

<div class="container-fluid px-0">
    <form action="/contenedores/busqueda" id="form_ctn_busqueda" method="GET" 
    class="container d-flex flex-column flex-md-row justify-content-center align-items-center">
        <div class="mb-2 col-8 col-md-4 col-lg-3 mb-md-0">
            <select name="select-ctn" id="id-select-ctn" class="form-select mr-md-2 text-center" form="form_ctn_busqueda"
                title="seleccion-ctn">
                <option selected value="id_contenedor">ID Contenedor</option>
                <option value="fecha_descarga">Fecha Descarga</option>
                <option value="sku_producto">SKU Producto</option>
            </select>
        </div>
        <div class="mb-3 col-8 col-md-4 d-flex flex-column flex-md-row justify-content-center">
            <div class="mb-2 mb-md-0">
                <input type="text" class="form-control" id="id_ctn" name="id_ctn" aria-label="identificador-buscar"
                    value="{{contenedorID}}" form="form_ctn_busqueda">
            </div>
            <div class="input-group-append text-center">
                <button class="btn btn-outline-secondary btn-busqueda" type="submit" aria-label="boton-buscar"
                    form="form_ctn_busqueda" id="button-addon2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </form>
    <div class="container table-responsive my-4">
        <table class="table table-striped">
            <thead>
                <tr id="encabezado"></tr>
            </thead>
            <tbody id="tablaContenedor">

            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="modalInput" tabindex="-1" aria-labelledby="miModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="miModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="mensaje-Modal">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

{%include 'footer.html' %}
