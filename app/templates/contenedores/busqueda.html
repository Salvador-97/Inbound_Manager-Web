{%include 'header.html' %}
<title>Búsqueda Contenedores</title>
<main class="contenedor-formulario">
    <h3 class="titulo">Búsqueda Contenedores</h3>
    <form action="/contenedores/busqueda" id="form_ctn_busqueda" method="GET"
        class="container ctn-form d-flex flex-column flex-md-row justify-content-center align-items-center">
        <div class="mb-2 col-8 col-md-4 col-lg-3 mb-md-0 input-form position-relative">
            <input type="hidden" name="select_ctn" id="select" value="id_contenedor" form="form_ctn_busqueda">
            <button name="select-btn" type="button" class=" mr-md-2 text-center" title="seleccion">
                <span class="texto-select">ID contenedor</span>
                <i class="fa-solid fa-caret-down flecha"></i>
            </button>
            <div class="input-form w-100 position-absolute nav-opciones ocultar">
                <button value="id_contenedor" type="button">ID Contenedor</button>
                <button value="fecha_descarga" type="button">Fecha Descarga</button>
                <button value="sku_producto" type="button">SKU Producto</button>
            </div>
        </div>
        <div class="mb-3 mb-lg-0 col-8 col-md-4 d-flex flex-column flex-md-row justify-content-center">
            <div class="input-form mb-2 mb-md-0">
                <input type="text" class="form-control" id="id_ctn" name="id_ctn" aria-label="identificador-buscar"
                    value="{{contenedorID}}" form="form_ctn_busqueda">
            </div>
            <div class="input-group-append text-center">
                <button class="btn btn-outline-secondary btn-busqueda" type="submit" aria-label="boton-buscar"
                    form="form_ctn_busqueda" id="button-addon2">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
        </div>
    </form>

    <div class="ctn-tabla">
<table class="table table-striped">
    <thead>
        <tr id="encabezado"></tr>
    </thead>
    <tbody id="tablaContenedor">
        
    </tbody>
    </table>
</div>

</main>

<!-- Modal -->
<div class="modal fade" id="modalInput" tabindex="-1" aria-labelledby="miModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="miModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="mensaje-Modal">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

{%include 'footer.html' %}
