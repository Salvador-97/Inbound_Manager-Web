{%include 'header.html' %}

<h2 class="titulo">Ubicaciones</h2>

<div class="container d-flex flex-column">
    <form action="/ubicaciones/buscar" method="GET" id="form-sku-ubicaciones">
        <div class="input-group mb-3 justify-content-center flex-column flex-lg-row">
            <div>
                <input type="text" class="form-control mb-2 mb-lg-0" placeholder="SKU Producto" id="sku_producto" name="sku_producto"
                    value="{{skuProducto}}" form="form-sku-ubicaciones">
            </div>
            <div class="input-group-append">
                <button class="btn btn-outline-secondary btn-busqueda mb-2 mb-lg-0" title="buscar"
                name="buscar-ubicacion" type="submit" id="busqueda"
                    form="form-sku-ubicaciones">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <div class="d-flex flex-lg-column mx-lg-3">
                <div class="">
                    <input class="form-check-input" type="checkbox" value="0" name="checkSin" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">
                        Sin Ubicación
                    </label>
                </div>
                <div class="mx-2 mx-lg-0">
                    <input class="form-check-input ml-2" type="checkbox" value="1" name="checkCon" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">
                        Con Ubicación
                    </label>
                </div>
            </div>
        </div>
    </form>
    <a type="button" href="/export-excel" class="btn btn-success col-9 col-sm-6 col-md-4 col-lg-3 mt-3 mx-auto">
        Exportar a Excel <i class="fa-solid fa-file-export"></i>
    </a>
</div>
<div class="table-responsive mt-3">
    <table class="table table-striped">
        <thead>
            <tr id="encabezado">
            </tr>
        </thead>
        <tbody id="contenido-tabla">
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="modalUbicacion" tabindex="-1" aria-labelledby="miModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="miModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="mensaje-Modal">
                <form action="" id="form-ubicacion">
                    <input type="text" class="form-check-input" title="ubicacion">
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" form="form-ubicacion" class="btn btn-success">Agregar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>

<!-- Modal -->
<div class="modal fade" id="modalError" tabindex="-1" aria-labelledby="miModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="miModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="mensaje-Modal">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

{%include 'footer.html' %}
