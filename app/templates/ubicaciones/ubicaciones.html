{%include 'header.html' %}

<h2 class="titulo">Ubicaciones</h2>

<div class="container">
    <form action="/ubicaciones/buscar" method="GET" id="form-sku-ubicaciones">
        <div class="input-group mb-3 justify-content-center flex-column">
            <div>
                <input type="text" class="form-control mb-2" placeholder="SKU Producto" id="sku_producto" name="sku_producto"
                    value="{{skuProducto}}" form="form-sku-ubicaciones">
            </div>
            <div class="input-group-append">
                <button class="btn btn-outline-secondary btn-busqueda mb-2" title="buscar"
                name="buscar-ubicacion" type="submit" id="busqueda"
                    form="form-sku-ubicaciones">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </button>
            </div>
            <div class="d-flex">
                <div class="">
                    <input class="form-check-input" type="checkbox" value="0" name="checkSin" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">
                        Sin Ubicación
                    </label>
                </div>
                <div class="ml-2">
                    <input class="form-check-input ml-2" type="checkbox" value="1" name="checkCon" id="checkDefault">
                    <label class="form-check-label" for="checkDefault">
                        Con Ubicación
                    </label>
                </div>
            </div>
        </div>
    </form>
</div>
<div class="ctn-tabla">
    <table class="table table-striped">
        <thead>
            <tr id="encabezado">
            </tr>
        </thead>
        <tbody id="contenido-tabla">
        </tbody>
    </table>
</div>

<!-- Modal -->
<div class="modal fade" id="modalUbicacion" tabindex="-1" aria-labelledby="miModalLabel">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="miModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="mensaje-Modal">
                <form action="" id="form-ubicacion">
                    <input type="text" class="form-check-input" title="ubicacion">
                </form>
            </div>
            <div class="modal-footer">
                <button type="submit" form="form-ubicacion" class="btn btn-success">Agregar</button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>

<!-- Modal -->
<div class="modal fade" id="modalError" tabindex="-1" aria-labelledby="miModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="miModalLabel">Título del modal</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body" id="mensaje-Modal">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

{%include 'footer.html' %}
