{%include 'header.html' %}
<h3 class="titulo">Nuevo Producto</h3>
    <div class="contenedor-tabla producto">
        <table class="table table-bordered">
        <thead class="thead-dark">
        </thead>
        <tbody>
            <form action="/productos/nuevo" id="form-nuevo-producto" method="POST">
                <tr>
                <th scope="row">SKU</th>
                <td>
                    <input type="text" class="form-control" form="form-nuevo-producto" name="skuProducto">
                </td>
                </tr>
                <tr>
                    <th scope="row">Descripción</th>
                    <td>
                        <input type="text" class="form-control" form="form-nuevo-producto" name="descripcion">
                    </td>
                </tr>
                <tr>
                    <th scope="row">Código de barras</th>
                    <td>
                    <input type="text" class="form-control" form="form-nuevo-producto" name="codigo_barras">
                    </td>
                </tr>
                <tr>
                    <th scope="row">Cajas por tarima</th>
                    <td>
                        <input type="text" class="form-control" form="form-nuevo-producto" name="cajas_tarima"> 
                    </td>
                    
                </tr>
                <tr>
                    <th scope="row">Productos por tarima</th>
                    <td>
                        <input type="text" class="form-control" form="form-nuevo-producto" name="producto_tarima">
                    </td>
                </tr>
                <tr>
                    <th scope="row">Master Pack</th>
                    <td>
                        <input type="text" class="form-control" form="form-nuevo-producto" name="master_pack">
                    </td>
                </tr>
                <tr>
                    <th colspan="2">
                        <button type="submit" class="btn btn-success" form="form-nuevo-producto">
                            <i class="fa-solid fa-circle-plus"></i>
                            Agregar producto
                        </button>
                    </th>
                </tr>
            </form>
        </tbody>
    </table>
    </div>
{%include 'footer.html' %}
